name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Released php-library-check component of middag-io/actions, called by its
  # major tag. The demo is an application with a committed composer.lock, so
  # the install comes FROM the lock (the deployed artifact) rather than
  # re-resolving: the clean-install guard catches a stale or broken lock, e.g.
  # one pinning a middag-io/framework version that lacks a class the demo uses.
  # The lock is resolved at the platform pin (PHP 8.3.0), so it installs on
  # every supported PHP; composer validate --strict checks it is in sync. The
  # static checks run on 8.3, the floor; the audit and PHPUnit on every
  # version. The tool caches live in .cache.
  php-library-check:
    uses: middag-io/actions/.github/workflows/php-library-check.yml@php-library-check-v1
    permissions:
      contents: read
    with:
      php-versions: '["8.3", "8.4", "8.5"]'
      php-extensions: curl, intl, mbstring, pdo, pdo_sqlite, sqlite3
      composer-validate-strict: true
      # check:coverage-md regenerates COVERAGE.md from the coverage manifest and
      # the installed libraries, and fails on any diff.
      composer-scripts: check:vendor, check:coverage-md
      tool-cache-paths: .cache
      audit-blocking-severities: critical, high

  # Second call of the same component: removes the platform pin and resolves
  # the highest dependency versions on the PHP of each job, then asserts that
  # every Symfony package the demo requires resolved to 8.x. A green run on
  # Symfony 7.4 does not pass. The static checks already run in the locked
  # job. test:highest leaves out the api-coverage group: a new @api symbol in
  # an unreleased-to-the-lock library announces work for the demo, it does not
  # break the pull request (the locked jobs run the group).
  php-library-check-highest:
    uses: middag-io/actions/.github/workflows/php-library-check.yml@php-library-check-v1
    permissions:
      contents: read
    with:
      php-versions: '["8.4", "8.5"]'
      php-extensions: curl, intl, mbstring, pdo, pdo_sqlite, sqlite3
      dependency-versions: highest
      unset-platform-php: true
      test-script: test:highest
      expect-majors: >-
        symfony/dotenv:8,
        symfony/console:8,
        symfony/event-dispatcher:8,
        symfony/filesystem:8,
        symfony/finder:8,
        symfony/lock:8,
        symfony/var-dumper:8
      composer-validate: false
      strict-psr: false
      phpstan-script: ""
      cs-fixer-script: ""
      rector-script: ""
      audit-blocking-severities: critical, high

  # Specific to this repository: type-check and lint the React host bundle in
  # ui/. The E2E job only runs the vite build, which does not type-check.
  ui-check:
    name: UI type check and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # @middag-io/react is published to GitHub Packages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@middag-io'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the UI dependencies (from the lockfile)
        working-directory: ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Lint
        working-directory: ui
        run: npm run lint

  # Specific to this repository, so it stays inline. Build the release image
  # WITHOUT pushing, so the Dockerfile (incl. the UI build stage + GitHub
  # Packages auth) is exercised on every PR — not only at release time.
  # Single native arch for speed; the release job does the multi-arch push.
  # Catches a broken Dockerfile before a release is cut.
  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # UI stage pulls @middag-io/react from GitHub Packages
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: middag-demo-standalone:ci
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot the baked image, assert UI assets are served)
        run: |
          docker run -d --name demo -p 8080:8080 middag-demo-standalone:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/login && break
            sleep 1
          done
          echo "login page:";  curl -s -o /dev/null -w '  /login -> %{http_code}\n'           http://localhost:8080/login
          echo "app.js:";      curl -s -o /dev/null -w '  /build/app.js -> %{http_code}\n'     http://localhost:8080/build/app.js
          echo "style.css:";   curl -s -o /dev/null -w '  /build/style.css -> %{http_code}\n'  http://localhost:8080/build/style.css
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/build/app.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/build/style.css)" = "200"
          docker rm -f demo
