name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # php-library-check composite action of middag-io/actions, called as a step
  # by its major tag. The demo is an application with a committed composer.lock, so
  # the install comes FROM the lock (the deployed artifact) rather than
  # re-resolving: the clean-install guard catches a stale or broken lock, e.g.
  # one pinning a middag-io/framework version that lacks a class the demo uses.
  # The lock is resolved at the platform pin (PHP 8.3.0), so it installs on
  # every supported PHP; composer validate --strict checks it is in sync. The
  # static checks run on 8.3, the floor; the audit and PHPUnit on every
  # version. A PHPStan ceiling pass (phpVersion 80600) runs on 8.6, the
  # newest supported PHP. The tool caches live in .cache.
  php-library-check:
    name: php-library-check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4", "8.5", "8.6"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the library
        uses: middag-io/actions/php-library-check@php-library-check-v1
        with:
          php-version: ${{ matrix.php-version }}
          php-extensions: curl, intl, mbstring, pdo, pdo_sqlite, sqlite3
          # Static checks only on the first PHP of the list (8.3), the minimum supported.
          static-checks: ${{ matrix.php-version == '8.3' }}
          composer-validate-strict: true
          # check:coverage-md regenerates COVERAGE.md from the coverage manifest and
          # the installed libraries, and fails on any diff.
          composer-scripts: check:vendor, check:coverage-md
          lint-script: check:lint
          tool-cache-paths: .cache
          audit-blocking-severities: critical, high

      # Ceiling pass: the floor static checks above analyse at phpVersion
      # 80300 on PHP 8.3; this step re-runs PHPStan with phpVersion 80600 on
      # the 8.6 job, so code that is deprecated or removed on the newest
      # supported PHP fails here. The action installed the dependencies.
      - name: PHPStan ceiling pass (phpVersion 80600)
        if: matrix.php-version == '8.6'
        run: composer check:stan:ceiling

  # Second run of the same component: removes the platform pin and resolves
  # the highest dependency versions on the PHP of each job, then asserts that
  # every Symfony package the demo requires resolved to 8.x. A green run on
  # Symfony 7.4 does not pass. The static checks already run in the locked
  # job. test:highest leaves out the api-coverage group: a new @api symbol in
  # an unreleased-to-the-lock library announces work for the demo, it does not
  # break the pull request (the locked jobs run the group).
  php-library-check-highest:
    name: php-library-check (PHP ${{ matrix.php-version }}, highest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5", "8.6"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the library (highest dependency versions)
        uses: middag-io/actions/php-library-check@php-library-check-v1
        with:
          php-version: ${{ matrix.php-version }}
          php-extensions: curl, intl, mbstring, pdo, pdo_sqlite, sqlite3
          static-checks: false
          dependency-versions: highest
          unset-platform-php: true
          test-script: test:highest
          tool-cache-paths: .cache
          expect-majors: >-
            symfony/dotenv:8,
            symfony/console:8,
            symfony/doctrine-messenger:8,
            symfony/event-dispatcher:8,
            symfony/filesystem:8,
            symfony/finder:8,
            symfony/lock:8,
            symfony/var-dumper:8
          composer-validate: false
          strict-psr: false
          phpstan-script: ""
          cs-fixer-script: ""
          rector-script: ""
          audit-blocking-severities: critical, high

  # Third run of the same component: removes the platform pin and resolves the
  # lowest stable versions the constraints allow (composer update
  # --prefer-lowest --prefer-stable) on PHP 8.3, the floor. The Symfony floor of
  # '^7.4 || ^8.1' is 7.4, so the job proves the 7.x floor and the declared PHP
  # and extension floors. Static checks stay in the locked job. test:highest
  # leaves out the api-coverage group, as in the highest job.
  php-library-check-lowest:
    name: php-library-check (PHP 8.3, lowest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the library (lowest dependency versions)
        uses: middag-io/actions/php-library-check@php-library-check-v1
        with:
          php-version: "8.3"
          php-extensions: curl, intl, mbstring, pdo, pdo_sqlite, sqlite3
          static-checks: false
          dependency-versions: lowest
          unset-platform-php: true
          test-script: test:highest
          tool-cache-paths: .cache
          expect-majors: >-
            symfony/dotenv:7,
            symfony/console:7,
            symfony/doctrine-messenger:7,
            symfony/event-dispatcher:7,
            symfony/filesystem:7,
            symfony/finder:7,
            symfony/lock:7,
            symfony/var-dumper:7
          composer-validate: false
          strict-psr: false
          phpstan-script: ""
          cs-fixer-script: ""
          rector-script: ""
          audit-blocking-severities: critical, high

  # Specific to this repository: type-check and lint the React host bundle in
  # ui/. The E2E job only runs the vite build, which does not type-check.
  ui-check:
    name: UI type check and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the UI dependencies (from the lockfile)
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Lint
        working-directory: ui
        run: npm run lint

  # Specific to this repository, so it stays inline. Build the release image
  # WITHOUT pushing, so the Dockerfile (incl. the UI build stage) is exercised on every PR — not only at release time.
  # Single native arch for speed; the release job does the multi-arch push.
  # Catches a broken Dockerfile before a release is cut.
  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: middag-demo-standalone:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot the baked image, assert UI assets are served)
        run: |
          docker run -d --name demo -p 8080:8080 middag-demo-standalone:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/login && break
            sleep 1
          done
          echo "login page:";  curl -s -o /dev/null -w '  /login -> %{http_code}\n'           http://localhost:8080/login
          echo "app.js:";      curl -s -o /dev/null -w '  /build/app.js -> %{http_code}\n'     http://localhost:8080/build/app.js
          echo "style.css:";   curl -s -o /dev/null -w '  /build/style.css -> %{http_code}\n'  http://localhost:8080/build/style.css
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/build/app.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/build/style.css)" = "200"
          docker rm -f demo
